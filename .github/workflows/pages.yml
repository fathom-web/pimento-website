name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build website
        run: python build.py
      - name: Apply GitHub Pages base path
        run: python publish_github_pages.py /pimento-website
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        uses: actions/deploy-pages@v4
        id: deployment
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
